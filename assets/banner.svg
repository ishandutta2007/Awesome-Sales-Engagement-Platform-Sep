<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #818cf8;
      letter-spacing: 1px;
    }
    .grid-line {
      stroke: #ffffff;
      stroke-opacity: 0.04;
      stroke-width: 1;
    }
    /* Animated dynamic elements kept subtle in background */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-15px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }
    .animated-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .animated-orb-2 {
      animation: pulseGlow 8s ease-in-out infinite 2s;
      transform-origin: 1000px 250px;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .p-delay-1 { animation-delay: 1s; }
    .p-delay-2 { animation-delay: 2.5s; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16" />

  <!-- Background Tech Grid Lines -->
  <g class="grid">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="350" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="350" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="350" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="350" class="grid-line" />
    <line x1="950" y1="0" x2="950" y2="350" class="grid-line" />
    <line x1="1150" y1="0" x2="1150" y2="350" class="grid-line" />
  </g>

  <!-- Dynamic Animated Orbs (Background Glows) -->
  <circle cx="200" cy="100" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" class="animated-orb-1" />
  <circle cx="1000" cy="250" r="160" fill="#a855f7" opacity="0.2" filter="url(#glow)" class="animated-orb-2" />

  <!-- Background Flow / Connectivity Nodes -->
  <g opacity="0.3">
    <path d="M 100 280 Q 250 200 400 250 T 700 180 T 1100 220" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="400" cy="250" r="4" fill="#a855f7" class="particle" />
    <circle cx="700" cy="180" r="5" fill="#ec4899" class="particle p-delay-1" />
    <circle cx="900" cy="200" r="4" fill="#6366f1" class="particle p-delay-2" />
  </g>

  <!-- Main Hero Card Backdrop -->
  <rect x="50" y="45" width="1100" height="260" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Accent Top Border Strip -->
  <rect x="50" y="45" width="1100" height="4" fill="url(#accentGrad)" rx="2" />

  <!-- Foreground Content Block (Layered above all background dynamics) -->
  <g transform="translate(90, 95)">
    <!-- Category Badge Pill -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4" />
    <text x="15" y="20" class="badge-text">🚀 SALES ENGAGEMENT ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="75" class="title">Awesome Sales Engagement Platforms</text>

    <!-- Subtitle -->
    <text x="0" y="118" class="subtitle">Curated SaaS &amp; Open-Source Tools for Multi-Channel Sequences, AI SDR &amp; Cold Email</text>

    <!-- Tech / Feature Pills -->
    <g transform="translate(0, 145)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="14" y="21" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="600">⚡ Cold Email</text>

      <!-- Pill 2 -->
      <rect x="162" y="0" width="165" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="176" y="21" font-family="sans-serif" font-size="13" fill="#c084fc" font-weight="600">🤖 AI SDR Agents</text>

      <!-- Pill 3 -->
      <rect x="339" y="0" width="185" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="353" y="21" font-family="sans-serif" font-size="13" fill="#4ade80" font-weight="600">🌐 LinkedIn Cadences</text>

      <!-- Pill 4 -->
      <rect x="536" y="0" width="175" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="550" y="21" font-family="sans-serif" font-size="13" fill="#fbbf24" font-weight="600">📦 Self-Hosted Stack</text>
    </g>
  </g>
</svg>
